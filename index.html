<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#004976">
<title>The Value of Impact | UNOPS</title>
<style>
html,body{margin:0;height:100%;background:#004976;color:#fff;font:16px/1.5 system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
.msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
</style>
</head>
<body>
<iframe id="game" title="The Value of Impact" allow="fullscreen; clipboard-write; web-share; autoplay"></iframe>
<div class="msg" id="msg"><p>The game address has not been set yet in index.html.</p></div>
<script>
/* The game's web app address, from Deploy > Manage deployments (it ends in /exec, with nothing after it). */
var GAME = 'PASTE_THE_GAME_ADDRESS_HERE';
/* The game opens inside this page. Anything after ? (a team code, v=wall...) is passed on to the game,
   except v=rapid: the game opens on it anyway, and that ending stops the game from loading on iPhones. */
var q = new URLSearchParams(location.search);
if ((q.get('v') || '').toLowerCase() === 'rapid') q.delete('v');
var rest = q.toString(), base = GAME.split('?')[0];
if (/^https:\/\/script\.google\.com\//.test(base)) document.getElementById('game').src = base + (rest ? '?' + rest : '');
else document.getElementById('msg').style.display = 'flex';
</script>
</body>
</html>
